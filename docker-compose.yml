# Octavo on this computer (and your home Wi-Fi).
#   1. Copy .env.example to .env and set OCTAVO_TOKEN.
#   2. docker compose up -d
#   3. Open http://localhost:4321
# To reach it from your phone away from home, use docker-compose.tailscale.yml
# instead. See docs/SELF_HOSTING.md.
services:
  octavo:
    build: .
    image: octavo
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      OCTAVO_TOKEN: ${OCTAVO_TOKEN:?Set OCTAVO_TOKEN in .env (see docs/SELF_HOSTING.md)}
    volumes:
      # Your notes, as plain Markdown files in this folder on your computer.
      - ${OCTAVO_VAULT_DIR:-./vault}:/vault
