name: Release

# Builds the desktop app for Windows and Linux and publishes a GitHub release
# (the macOS build adds itself afterwards), either when a version tag (e.g. v0.1.0) is pushed, or when run by
# hand from the Actions tab (GitHub then creates the tag for you).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create, e.g. v1.0.0 (a tag with a dash, like v1.1.0-beta.1, becomes a test build)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npm test
      - run: npm run typecheck

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npm run dist:desktop -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: octavo-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/dist/*.exe
            release/dist/*.dmg
            release/dist/*.zip
            release/dist/*.AppImage
            release/dist/latest*.yml
            release/dist/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          ls -la artifacts
          # A tag like v1.1.0-beta.1 is published as a pre-release (test build); v1.0.0 as a normal release.
          if [[ "$TAG" == *-* ]]; then
            EXTRA=(--prerelease); TITLE="Octavo ${TAG#v} (test build)"
          else
            EXTRA=(--latest); TITLE="Octavo ${TAG#v}"
          fi
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file .github/release-notes.md \
            "${EXTRA[@]}"

  # macOS machines on GitHub are sometimes unavailable for a long time, so the Mac build
  # doesn't hold up the release: it adds its files to the published release once it's done.
  mac:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npm run dist:desktop -- --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Add to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" release/dist/*.dmg release/dist/*.zip release/dist/latest-mac.yml release/dist/*.blockmap \
            --repo "$GITHUB_REPOSITORY" --clobber
