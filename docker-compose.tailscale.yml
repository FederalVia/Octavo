# Ultron on your PC, reachable from your phone anywhere (mobile data included)
# through your private Tailscale network, at https://<TS_HOSTNAME>.<your-tailnet>.ts.net
#
#   1. Copy .env.example to .env and set ULTRON_TOKEN and TS_AUTHKEY.
#   2. docker compose -f docker-compose.tailscale.yml up -d
#
# Step-by-step guide: docs/SELF_HOSTING.md
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-ultron}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env (see docs/SELF_HOSTING.md)}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking works on Windows, macOS and Linux without extra privileges.
      TS_USERSPACE: "true"
      # Serve Ultron over HTTPS on your tailnet (certificate managed by Tailscale).
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
    ports:
      # Also usable on this PC at http://localhost:4321
      - "127.0.0.1:4321:4321"

  ultron-mind:
    build: .
    image: ultron-mind
    restart: unless-stopped
    # Share the Tailscale container's network so Tailscale can reach Ultron.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      ULTRON_TOKEN: ${ULTRON_TOKEN:?Set ULTRON_TOKEN in .env (see docs/SELF_HOSTING.md)}
    volumes:
      # Your notes, as plain Markdown files in this folder on your PC.
      - ${ULTRON_VAULT_DIR:-./vault}:/vault

volumes:
  tailscale-state:
