# Octavo on your PC at your own public web address with automatic HTTPS
# (e.g. https://mind.example.com). Needs a domain name pointing at your home
# IP and ports 80 + 443 forwarded from your router to this PC.
#
#   1. Copy .env.example to .env and set OCTAVO_TOKEN and OCTAVO_DOMAIN.
#   2. docker compose -f docker-compose.caddy.yml up -d
#
# Step-by-step guide: docs/SELF_HOSTING.md
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OCTAVO_DOMAIN: ${OCTAVO_DOMAIN:?Set OCTAVO_DOMAIN in .env (see docs/SELF_HOSTING.md)}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - octavo

  octavo:
    build: .
    image: octavo
    restart: unless-stopped
    environment:
      OCTAVO_TOKEN: ${OCTAVO_TOKEN:?Set OCTAVO_TOKEN in .env (see docs/SELF_HOSTING.md)}
      # Requests arrive from Caddy on the private Docker network: trust its X-Forwarded-For so each
      # device gets its own wrong-key lockout. Octavo's port isn't published, so only Caddy reaches it.
      OCTAVO_TRUST_PROXY: uniquelocal
    volumes:
      - ${OCTAVO_VAULT_DIR:-./vault}:/vault

volumes:
  caddy-data:
  caddy-config:
